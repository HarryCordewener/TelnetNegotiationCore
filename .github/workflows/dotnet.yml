name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Nothing here writes anything: least privilege for the token every job gets.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: ['net8.0', 'net10.0', 'net11.0']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # global.json pins the SDK that builds every target; 8.0.x and 10.0.x bring the runtimes
        # the net8.0 and net10.0 tests run on.
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test with TUnit (${{ matrix.framework }})
      run: dotnet run --project TelnetNegotiationCore.UnitTests --configuration Debug --no-build --framework ${{ matrix.framework }}
