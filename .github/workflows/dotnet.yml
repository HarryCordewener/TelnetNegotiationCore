name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: ['net8.0', 'net10.0', 'net11.0']

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # global.json pins the SDK that builds every target; 8.0.x and 10.0.x bring the runtimes
        # the net8.0 and net10.0 tests run on.
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test with TUnit (${{ matrix.framework }})
      run: dotnet run --project TelnetNegotiationCore.UnitTests --configuration Debug --no-build --framework ${{ matrix.framework }}
