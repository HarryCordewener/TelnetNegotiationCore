name: Release

on:
  workflow_dispatch:
    inputs:
      tags: 
        required: true
        type: string
        description: Example - v2.4.1
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

# The default for every job. `build` and `release` widen it themselves, to exactly what each needs.
permissions:
  contents: read

jobs:    
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        framework: ['net8.0', 'net10.0', 'net11.0']
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # global.json pins the SDK that builds every target; 8.0.x and 10.0.x bring the runtimes
        # the net8.0 and net10.0 tests run on.
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          10.0.x
  
    - name: Restore dependencies
      run: dotnet restore
  
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test with TUnit (${{ matrix.framework }})
      run: dotnet run --project TelnetNegotiationCore.UnitTests --configuration Release --no-build --framework ${{ matrix.framework }}
  
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    
    - name: Restore dependencies
      run: dotnet restore
   
    # Asked as an ancestry question against main's full history. The old form fetched every branch at
    # --depth=1 and grepped `git branch --remote --contains`, but a depth-1 main holds only its tip, so
    # it passed only while the tagged commit was still main's newest: v3.0.0's re-run failed here
    # because #101 had merged in between. (The grep also matched any branch name starting main.)
    - name: Verify commit exists in origin/main
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
        else
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        fi
        git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
   
    # The dispatch input reaches the shell as an environment variable, never as text pasted into
    # the script: `${{ }}` is substituted before bash parses the line, so a tag containing shell
    # metacharacters would otherwise run as part of the command.
    - name: Set VERSION variable
      env:
        INPUT_TAG: ${{ inputs.tags }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          TAG="$INPUT_TAG"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "VERSION=${TAG#v}" >> $GITHUB_ENV
   
    - name: Build
      run: dotnet build --configuration Release /p:Version=${VERSION} --no-restore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "**/*.nupkg"

    - name: Upload NuGet packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-packages
        path: "**/*.nupkg"

  release:
    permissions:
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: packages

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - name: Push to GitHub Packages
      run: dotnet nuget push "packages/**/*.nupkg" --skip-duplicate --source https://nuget.pkg.github.com/HarryCordewener/index.json --api-key ${GITHUB_TOKEN}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: NuGet Login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: harrycordewener
        
    - name: Push to NuGet
      run: dotnet nuget push "packages/**/*.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json -k ${{steps.login.outputs.NUGET_API_KEY}}
