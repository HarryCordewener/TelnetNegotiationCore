name: Release

on:
  workflow_dispatch:
    inputs:
      tags: 
        required: true
        type: string
        description: Example - v2.4.1
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
jobs:    
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        framework: ['net8.0', 'net10.0', 'net11.0']
    steps:
    - name: Checkout
      uses: actions/checkout@v6
  
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # global.json pins the SDK that builds every target; 8.0.x and 10.0.x bring the runtimes
        # the net8.0 and net10.0 tests run on.
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          10.0.x
  
    - name: Restore dependencies
      run: dotnet restore
  
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test with TUnit (${{ matrix.framework }})
      run: dotnet run --project TelnetNegotiationCore.UnitTests --configuration Release --no-build --framework ${{ matrix.framework }}
  
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
 
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    
    - name: Restore dependencies
      run: dotnet restore
   
    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main
   
    - name: Set VERSION variable
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tags }}"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "VERSION=${TAG#v}" >> $GITHUB_ENV
   
    - name: Build
      run: dotnet build --configuration Release /p:Version=${VERSION} --no-restore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: "**/*.nupkg"

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: "**/*.nupkg"

  release:
    permissions:
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: packages

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Push to GitHub Packages
      run: dotnet nuget push "packages/**/*.nupkg" --skip-duplicate --source https://nuget.pkg.github.com/HarryCordewener/index.json --api-key ${GITHUB_TOKEN}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: NuGet Login
      uses: NuGet/login@v1
      id: login
      with:
        user: harrycordewener
        
    - name: Push to NuGet
      run: dotnet nuget push "packages/**/*.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json -k ${{steps.login.outputs.NUGET_API_KEY}}
