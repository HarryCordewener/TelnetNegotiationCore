# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Pinned actions stop being a security measure the moment they stop being updated: Dependabot
  # rewrites the digest and the version comment together, so a pin stays current without anyone
  # reading release notes for a living.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: [ "*" ]
